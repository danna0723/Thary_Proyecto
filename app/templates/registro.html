<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Crear cuenta — Sistema de Predicción de Demanda e Inventario</title>
  <script src="https://kit.fontawesome.com/e93ccfb9a4.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ static_url('vendor/modular-admin/css/vendor.css') }}">
  <link rel="stylesheet" href="{{ static_url('vendor/modular-admin/css/app.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/login.css') }}">
</head>

<body class="login-body">
  <div class="login-blob login-blob-1"></div>
  <div class="login-blob login-blob-2"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="{{ static_url('img/logo-icono.png') }}" alt="Thary">
      </div>
      <h4 class="login-title">Crear cuenta</h4>
      <p class="login-subtitle">Completa tus datos para registrarte</p>

      {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
        <div class="alert alert-danger login-alert">
          {% for mensaje in mensajes %}<p class="mb-0">{{ mensaje }}</p>{% endfor %}
        </div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.registro') }}">
        <div class="form-group login-field">
          <label for="nombre">Nombre</label>
          <div class="login-input-icon">
            <i class="fa fa-id-card"></i>
            <input type="text" id="nombre" name="nombre" class="form-control" required autofocus>
          </div>
        </div>
        <div class="form-group login-field">
          <label for="username">Usuario</label>
          <div class="login-input-icon">
            <i class="fa fa-user"></i>
            <input type="text" id="username" name="username" class="form-control" required>
          </div>
        </div>
        <div class="form-group login-field">
          <label for="email">Email</label>
          <div class="login-input-icon">
            <i class="fa fa-envelope"></i>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
        </div>
        <div class="form-group login-field">
          <label for="password">Contraseña</label>
          <div class="login-input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control" required minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-btn">Crear cuenta</button>
      </form>

      <p class="login-footer">
        ¿Ya tienes cuenta?
        <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
      </p>
    </div>
  </div>
</body>

</html>
